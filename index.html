<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b9a7e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Recipes">
  <title>My Recipes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
:root {
  --milk: #fffdf8;
  --paper: #ffffff;
  --lavender: #b9a7e8;
  --lavender-dark: #7c67b8;
  --lavender-soft: #eee9fb;
  --lavender-pale: #f7f4ff;
  --ink: #25212f;
  --muted: #777181;
  --line: #e9e3ee;
  --danger: #b65a6a;
  --shadow: 0 10px 30px rgba(65, 47, 92, 0.08);
  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 13px;
}

* { box-sizing: border-box; }
html { background: var(--milk); }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--milk);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app-shell {
  width: min(100%, 520px);
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--milk);
  position: relative;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
}
.eyebrow {
  margin: 0 0 2px;
  color: var(--lavender-dark);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 0; font-size: 29px; line-height: 1.05; letter-spacing: -.04em; }
h2 { margin-bottom: 4px; font-size: 22px; letter-spacing: -.03em; }

.icon-button {
  border: 0;
  background: var(--lavender);
  color: white;
  width: 48px;
  height: 48px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-size: 30px;
  line-height: 1;
  box-shadow: var(--shadow);
}
.icon-button.small {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  font-size: 20px;
  background: var(--lavender-soft);
  color: var(--lavender-dark);
  box-shadow: none;
}

.view { display: none; }
.view.active-view { display: block; }

.search-section { padding: 4px 20px 10px; }
.search-box {
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--paper);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
}
.search-box span { color: var(--lavender-dark); font-size: 22px; }
.search-box input {
  width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink);
}
.search-box input::placeholder { color: #aaa3ae; }

.category-strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 6px 20px 13px;
  scrollbar-width: none;
}
.category-strip::-webkit-scrollbar { display: none; }
.category-chip {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--muted);
  border-radius: 999px;
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 700;
}
.category-chip.active {
  color: var(--lavender-dark);
  border-color: transparent;
  background: var(--lavender-soft);
}

.library-heading {
  padding: 8px 20px 12px;
  display: flex;
  align-items: end;
  justify-content: space-between;
}
.library-heading p { margin: 0; color: var(--muted); font-size: 13px; }

.recipe-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 0 20px calc(28px + env(safe-area-inset-bottom));
}
.recipe-card {
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--paper);
  overflow: hidden;
  text-align: left;
  padding: 0;
  color: inherit;
}
.recipe-card-image {
  position: relative;
  aspect-ratio: 1 / .9;
  background: var(--lavender-pale);
  overflow: hidden;
}
.recipe-card-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.recipe-card-placeholder {
  width: 100%; height: 100%; display: grid; place-items: center; font-size: 34px; color: var(--lavender-dark);
}
.favorite-badge {
  position: absolute; right: 9px; top: 9px; width: 34px; height: 34px; border: 0; border-radius: 999px;
  background: rgba(255,253,248,.94); color: var(--lavender-dark); font-size: 19px;
}
.recipe-card-copy { padding: 11px 12px 13px; }
.recipe-card-copy h3 { margin: 0 0 5px; font-size: 15px; line-height: 1.2; letter-spacing: -.02em; }
.recipe-card-copy p { margin: 0; color: var(--muted); font-size: 12px; }

.empty-state { text-align: center; padding: 70px 36px 100px; color: var(--muted); }
.empty-state h3 { color: var(--ink); margin-bottom: 8px; font-size: 20px; }
.empty-state p { line-height: 1.5; }
.empty-icon { width: 64px; height: 64px; border-radius: 20px; background: var(--lavender-soft); color: var(--lavender-dark); display:grid; place-items:center; font-size: 32px; margin: 0 auto 16px; }
.primary-button {
  border: 0; border-radius: 16px; background: var(--lavender); color: white; font-weight: 800; padding: 14px 19px;
}

.detail-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 66px;
  padding: calc(10px + env(safe-area-inset-top)) 18px 8px;
  position: sticky;
  top: 0;
  z-index: 6;
  background: rgba(255,253,248,.96);
  border-bottom: 1px solid rgba(233,227,238,.75);
}
.toolbar-actions { display: flex; gap: 8px; }
.text-button { border: 0; background: transparent; color: var(--lavender-dark); padding: 8px 2px; font-weight: 800; }
.save-link { min-width: 48px; text-align: right; }

.detail-content { padding-bottom: calc(34px + env(safe-area-inset-bottom)); }
.detail-hero { width: calc(100% - 40px); margin: 12px 20px 18px; aspect-ratio: 1.35 / 1; border-radius: 24px; overflow: hidden; background: var(--lavender-pale); }
.detail-hero img { width: 100%; height: 100%; object-fit: cover; display:block; }
.detail-hero.placeholder { display:grid; place-items:center; color: var(--lavender-dark); font-size: 56px; }
.detail-header { padding: 0 20px 20px; border-bottom: 1px solid var(--line); }
.detail-header h1 { font-size: 31px; margin-bottom: 9px; }
.meta-row { display:flex; gap: 8px; flex-wrap:wrap; align-items:center; }
.category-pill, .meta-pill { display:inline-flex; align-items:center; min-height: 30px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 750; }
.category-pill { background: var(--lavender-soft); color: var(--lavender-dark); }
.meta-pill { background: #f5f1f1; color: var(--muted); }
.detail-section { padding: 22px 20px 0; }
.detail-section h2 { font-size: 19px; margin-bottom: 14px; }
.ingredient-list { list-style: none; padding: 0; margin: 0; display:grid; gap: 10px; }
.ingredient-list li { display:flex; gap: 11px; align-items:flex-start; line-height: 1.4; font-size: 14px; }
.ingredient-dot { width: 19px; height: 19px; border: 1.5px solid var(--lavender); border-radius: 6px; flex:0 0 auto; margin-top: 1px; }
.step-list { list-style: none; padding: 0; margin: 0; display:grid; gap: 15px; }
.step-list li { display:grid; grid-template-columns: 28px 1fr; gap: 10px; line-height: 1.45; font-size: 14px; }
.step-number { width: 28px; height: 28px; border-radius: 10px; display:grid; place-items:center; background: var(--lavender-soft); color: var(--lavender-dark); font-size: 12px; font-weight: 800; }
.photo-gallery { display:grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.photo-gallery img { width:100%; aspect-ratio:1; object-fit:cover; border-radius: 16px; }

.editor-toolbar h2 { margin:0; font-size:17px; }
.recipe-form { padding: 14px 20px 0; }
.cover-upload { display:block; width:100%; aspect-ratio: 1.45/1; border-radius: 24px; background: var(--lavender-pale); border: 1px dashed #cfc1f2; overflow:hidden; margin-bottom: 14px; }
.cover-upload img { width:100%; height:100%; object-fit:cover; display:block; }
#coverPlaceholder { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color: var(--lavender-dark); }
#coverPlaceholder b { font-size:30px; font-weight:400; }
#coverPlaceholder strong { font-size:15px; }
#coverPlaceholder small { color: var(--muted); }
.form-card { background: var(--paper); border:1px solid var(--line); border-radius:20px; padding: 16px; margin-bottom: 12px; }
.form-card label { display:block; margin-bottom:14px; }
.form-card label:last-child { margin-bottom:0; }
.form-card label > span, .section-label { display:block; margin:0 0 7px; font-size:13px; font-weight:800; }
.form-card input, .form-card select, .form-card textarea {
  width:100%; border:1px solid var(--line); background:#fff; border-radius:13px; padding:12px; outline:0; color:var(--ink);
}
.form-card input:focus, .form-card select:focus, .form-card textarea:focus { border-color: var(--lavender); box-shadow: 0 0 0 3px var(--lavender-soft); }
.two-column-fields { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.section-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px; }
.section-row small { color:var(--muted); font-size:11px; }
.mini-add { border:0; border-radius:999px; padding:8px 10px; background:var(--lavender-soft); color:var(--lavender-dark); font-size:12px; font-weight:800; white-space:nowrap; }
.repeat-list { display:grid; gap:9px; }
.repeat-row { display:grid; grid-template-columns: 28px 1fr 30px; gap:7px; align-items:start; }
.repeat-row textarea { resize:none; min-height:45px; overflow:hidden; }
.row-number { width:28px; height:28px; margin-top:8px; display:grid; place-items:center; border-radius:10px; background:var(--lavender-soft); color:var(--lavender-dark); font-size:11px; font-weight:800; }
.remove-row { margin-top:7px; width:30px; height:30px; border:0; border-radius:10px; background:#f8f3f5; color:#a27680; font-size:20px; }
.gallery-editor { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.gallery-thumb { position:relative; aspect-ratio:1; border-radius:13px; overflow:hidden; background:var(--lavender-pale); }
.gallery-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.gallery-thumb button { position:absolute; top:5px; right:5px; width:25px; height:25px; border:0; border-radius:999px; background:rgba(255,255,255,.92); color:var(--danger); }
.file-label { display:inline-flex; }
.danger-button { width:100%; border:1px solid #efd3da; background:#fff7f8; color:var(--danger); border-radius:16px; padding:14px; font-weight:800; margin-top:4px; }
.safe-bottom-space { height: calc(20px + env(safe-area-inset-bottom)); }

.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 15px); background: var(--ink); color:white; padding:10px 14px; border-radius:999px; font-size:12px; opacity:0; pointer-events:none; transition:.2s ease; z-index:50;
}
.toast.show { opacity:1; transform:translate(-50%,0); }

@media (min-width: 500px) {
  .app-shell { border-left:1px solid var(--line); border-right:1px solid var(--line); }
  .recipe-grid { gap:14px; }
}

</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">My kitchen</p>
        <h1>My Recipes</h1>
      </div>
      <button class="icon-button add-main" id="addRecipeBtn" aria-label="Add recipe">+</button>
    </header>

    <main id="libraryView" class="view active-view">
      <section class="search-section" aria-label="Search recipes">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Search recipes" autocomplete="off">
        </label>
      </section>

      <nav class="category-strip" id="categoryStrip" aria-label="Recipe categories"></nav>

      <section class="library-heading">
        <div>
          <h2 id="sectionTitle">All Recipes</h2>
          <p id="recipeCount">0 recipes</p>
        </div>
      </section>

      <section id="recipeGrid" class="recipe-grid" aria-live="polite"></section>

      <section id="emptyState" class="empty-state" hidden>
        <div class="empty-icon">♡</div>
        <h3>No recipes here yet</h3>
        <p>Add your first recipe and make this your personal cookbook.</p>
        <button class="primary-button" id="emptyAddBtn">Add a recipe</button>
      </section>
    </main>

    <main id="detailView" class="view" aria-hidden="true">
      <div class="detail-toolbar">
        <button class="text-button" id="backBtn">‹ Back</button>
        <div class="toolbar-actions">
          <button class="icon-button small" id="detailFavoriteBtn" aria-label="Favorite recipe">♡</button>
          <button class="icon-button small" id="editRecipeBtn" aria-label="Edit recipe">✎</button>
        </div>
      </div>
      <article id="detailContent" class="detail-content"></article>
    </main>

    <main id="editorView" class="view" aria-hidden="true">
      <div class="detail-toolbar editor-toolbar">
        <button class="text-button" id="cancelEditBtn">Cancel</button>
        <h2 id="editorTitle">Add Recipe</h2>
        <button class="text-button save-link" id="saveRecipeBtn">Save</button>
      </div>

      <form id="recipeForm" class="recipe-form">
        <input type="hidden" id="recipeId">

        <label class="cover-upload" id="coverUploadLabel">
          <input id="coverInput" type="file" accept="image/*" capture="environment" hidden>
          <img id="coverPreview" alt="Recipe cover preview" hidden>
          <span id="coverPlaceholder">
            <b>＋</b>
            <strong>Add cover photo</strong>
            <small>Use your finished food photo</small>
          </span>
        </label>

        <section class="form-card">
          <label>
            <span>Recipe name</span>
            <input id="titleInput" required maxlength="80" placeholder="e.g. Matcha Tiramisu">
          </label>
          <label>
            <span>Category</span>
            <select id="categoryInput" required>
              <option>Breakfast</option>
              <option>Main Food</option>
              <option>Noodles</option>
              <option>Rice</option>
              <option>Dessert</option>
            </select>
          </label>
          <div class="two-column-fields">
            <label>
              <span>Cook time</span>
              <input id="cookTimeInput" maxlength="30" placeholder="30 min">
            </label>
            <label>
              <span>Servings</span>
              <input id="servingsInput" maxlength="30" placeholder="2">
            </label>
          </div>
        </section>

        <section class="form-card repeat-section">
          <div class="section-row">
            <div>
              <p class="section-label">Ingredients</p>
              <small>Add one ingredient per line.</small>
            </div>
            <button type="button" class="mini-add" id="addIngredientBtn">＋ Add</button>
          </div>
          <div id="ingredientsEditor" class="repeat-list"></div>
        </section>

        <section class="form-card repeat-section">
          <div class="section-row">
            <div>
              <p class="section-label">Steps</p>
              <small>Keep each step short and clear.</small>
            </div>
            <button type="button" class="mini-add" id="addStepBtn">＋ Add</button>
          </div>
          <div id="stepsEditor" class="repeat-list"></div>
        </section>

        <section class="form-card gallery-editor-section">
          <div class="section-row">
            <div>
              <p class="section-label">Extra Photos</p>
              <small>Add process or plating photos.</small>
            </div>
            <label class="mini-add file-label">
              ＋ Add
              <input id="galleryInput" type="file" accept="image/*" multiple hidden>
            </label>
          </div>
          <div id="galleryEditor" class="gallery-editor"></div>
        </section>

        <button type="button" id="deleteRecipeBtn" class="danger-button" hidden>Delete Recipe</button>
        <div class="safe-bottom-space"></div>
      </form>
    </main>
  </div>

  <template id="repeatRowTemplate">
    <div class="repeat-row">
      <span class="row-number"></span>
      <textarea rows="1"></textarea>
      <button type="button" class="remove-row" aria-label="Remove">×</button>
    </div>
  </template>

  <script>

const CATEGORIES = ['All', 'Breakfast', 'Main Food', 'Noodles', 'Rice', 'Dessert', 'Favorites'];

function matchesRecipeFilter(recipe, { search = '', category = 'All' } = {}) {
  const query = search.trim().toLowerCase();
  const titleMatches = !query || (recipe.title || '').toLowerCase().includes(query);
  const categoryMatches = category === 'All'
    || (category === 'Favorites' ? Boolean(recipe.favorite) : recipe.category === category);
  return titleMatches && categoryMatches;
}

function createRecipeRecord(input, id = crypto.randomUUID()) {
  const now = new Date().toISOString();
  const cleanList = (items = []) => items.map(item => String(item).trim()).filter(Boolean);
  return {
    id,
    title: String(input.title || '').trim(),
    category: String(input.category || 'Main Food').trim(),
    cookTime: String(input.cookTime || '').trim(),
    servings: String(input.servings || '').trim(),
    ingredients: cleanList(input.ingredients),
    steps: cleanList(input.steps),
    coverImage: input.coverImage || '',
    galleryImages: Array.isArray(input.galleryImages) ? input.galleryImages.filter(Boolean) : [],
    favorite: Boolean(input.favorite),
    createdAt: input.createdAt || now,
    updatedAt: now
  };
}


const DB_NAME = 'recipeTrackerDB';
const DB_VERSION = 1;
const STORE_NAME = 'recipes';

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        store.createIndex('updatedAt', 'updatedAt');
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function requestToPromise(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function getAllRecipes() {
  const db = await openDB();
  try {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const results = await requestToPromise(tx.objectStore(STORE_NAME).getAll());
    return results.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  } finally {
    db.close();
  }
}

async function getRecipe(id) {
  const db = await openDB();
  try {
    const tx = db.transaction(STORE_NAME, 'readonly');
    return await requestToPromise(tx.objectStore(STORE_NAME).get(id));
  } finally {
    db.close();
  }
}

async function saveRecipe(recipe) {
  const db = await openDB();
  try {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    await requestToPromise(tx.objectStore(STORE_NAME).put(recipe));
    return recipe;
  } finally {
    db.close();
  }
}

async function deleteRecipe(id) {
  const db = await openDB();
  try {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    await requestToPromise(tx.objectStore(STORE_NAME).delete(id));
  } finally {
    db.close();
  }
}



const state = {
  recipes: [],
  category: 'All',
  search: '',
  currentRecipeId: null,
  coverImage: '',
  galleryImages: []
};

const $ = (id) => document.getElementById(id);
const views = ['libraryView', 'detailView', 'editorView'];

function showView(id) {
  views.forEach(viewId => {
    const element = $(viewId);
    const active = viewId === id;
    element.classList.toggle('active-view', active);
    element.setAttribute('aria-hidden', String(!active));
  });
  window.scrollTo(0, 0);
}

function escapeHTML(value = '') {
  return String(value).replace(/[&<>'"]/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[char]));
}

function renderCategories() {
  $('categoryStrip').innerHTML = CATEGORIES.map(category => `
    <button class="category-chip ${category === state.category ? 'active' : ''}" data-category="${escapeHTML(category)}">${escapeHTML(category)}</button>
  `).join('');
}

function filteredRecipes() {
  return state.recipes.filter(recipe => matchesRecipeFilter(recipe, { search: state.search, category: state.category }));
}

function renderLibrary() {
  renderCategories();
  const recipes = filteredRecipes();
  $('sectionTitle').textContent = state.category === 'All' ? 'All Recipes' : state.category;
  $('recipeCount').textContent = `${recipes.length} ${recipes.length === 1 ? 'recipe' : 'recipes'}`;
  $('emptyState').hidden = recipes.length !== 0;
  $('recipeGrid').hidden = recipes.length === 0;

  $('recipeGrid').innerHTML = recipes.map(recipe => `
    <article class="recipe-card" data-open-recipe="${recipe.id}">
      <div class="recipe-card-image">
        ${recipe.coverImage ? `<img src="${recipe.coverImage}" alt="${escapeHTML(recipe.title)}">` : '<div class="recipe-card-placeholder">♨</div>'}
        <button class="favorite-badge" data-favorite="${recipe.id}" aria-label="${recipe.favorite ? 'Remove from favorites' : 'Add to favorites'}">${recipe.favorite ? '♥' : '♡'}</button>
      </div>
      <div class="recipe-card-copy">
        <h3>${escapeHTML(recipe.title)}</h3>
        <p>${escapeHTML(recipe.category)}</p>
      </div>
    </article>
  `).join('');
}

async function refreshRecipes() {
  state.recipes = await getAllRecipes();
  renderLibrary();
}

function renderDetail(recipe) {
  const ingredients = recipe.ingredients.length
    ? `<ul class="ingredient-list">${recipe.ingredients.map(item => `<li><span class="ingredient-dot"></span><span>${escapeHTML(item)}</span></li>`).join('')}</ul>`
    : '<p class="muted-copy">No ingredients added.</p>';

  const steps = recipe.steps.length
    ? `<ol class="step-list">${recipe.steps.map((step, index) => `<li><span class="step-number">${index + 1}</span><span>${escapeHTML(step)}</span></li>`).join('')}</ol>`
    : '<p class="muted-copy">No steps added.</p>';

  const meta = [
    recipe.cookTime ? `<span class="meta-pill">◷ ${escapeHTML(recipe.cookTime)}</span>` : '',
    recipe.servings ? `<span class="meta-pill">♙ ${escapeHTML(recipe.servings)} ${/serv/i.test(recipe.servings) ? '' : 'servings'}</span>` : ''
  ].join('');

  $('detailContent').innerHTML = `
    <div class="detail-hero ${recipe.coverImage ? '' : 'placeholder'}">
      ${recipe.coverImage ? `<img src="${recipe.coverImage}" alt="${escapeHTML(recipe.title)}">` : '♨'}
    </div>
    <header class="detail-header">
      <h1>${escapeHTML(recipe.title)}</h1>
      <div class="meta-row">
        <span class="category-pill">${escapeHTML(recipe.category)}</span>
        ${meta}
      </div>
    </header>
    <section class="detail-section"><h2>Ingredients</h2>${ingredients}</section>
    <section class="detail-section"><h2>Steps</h2>${steps}</section>
    ${recipe.galleryImages.length ? `<section class="detail-section"><h2>Photos</h2><div class="photo-gallery">${recipe.galleryImages.map((src, i) => `<img src="${src}" alt="${escapeHTML(recipe.title)} extra photo ${i + 1}">`).join('')}</div></section>` : ''}
  `;
  $('detailFavoriteBtn').textContent = recipe.favorite ? '♥' : '♡';
}

async function openRecipe(id) {
  const recipe = await getRecipe(id);
  if (!recipe) return;
  state.currentRecipeId = id;
  renderDetail(recipe);
  showView('detailView');
}

function addRepeatRow(containerId, value = '', type = 'ingredient') {
  const fragment = $('repeatRowTemplate').content.cloneNode(true);
  const row = fragment.querySelector('.repeat-row');
  const textarea = row.querySelector('textarea');
  textarea.value = value;
  textarea.placeholder = type === 'ingredient' ? 'e.g. 2 eggs' : 'Describe this step';
  textarea.dataset.type = type;
  row.querySelector('.remove-row').addEventListener('click', () => {
    row.remove();
    renumberRows(containerId);
  });
  textarea.addEventListener('input', () => autoResize(textarea));
  $(containerId).appendChild(fragment);
  renumberRows(containerId);
  autoResize(textarea);
}

function renumberRows(containerId) {
  [...$(containerId).querySelectorAll('.repeat-row')].forEach((row, index) => {
    row.querySelector('.row-number').textContent = index + 1;
  });
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = `${Math.min(Math.max(textarea.scrollHeight, 45), 180)}px`;
}

function resetEditor() {
  $('recipeForm').reset();
  $('recipeId').value = '';
  state.currentRecipeId = null;
  state.coverImage = '';
  state.galleryImages = [];
  $('coverPreview').hidden = true;
  $('coverPreview').removeAttribute('src');
  $('coverPlaceholder').hidden = false;
  $('ingredientsEditor').innerHTML = '';
  $('stepsEditor').innerHTML = '';
  $('galleryEditor').innerHTML = '';
  addRepeatRow('ingredientsEditor', '', 'ingredient');
  addRepeatRow('stepsEditor', '', 'step');
  $('deleteRecipeBtn').hidden = true;
  $('editorTitle').textContent = 'Add Recipe';
}

async function openEditor(recipeId = null) {
  resetEditor();
  if (recipeId) {
    const recipe = await getRecipe(recipeId);
    if (!recipe) return;
    state.currentRecipeId = recipeId;
    $('recipeId').value = recipeId;
    $('titleInput').value = recipe.title;
    $('categoryInput').value = recipe.category;
    $('cookTimeInput').value = recipe.cookTime || '';
    $('servingsInput').value = recipe.servings || '';
    state.coverImage = recipe.coverImage || '';
    state.galleryImages = [...(recipe.galleryImages || [])];
    if (state.coverImage) {
      $('coverPreview').src = state.coverImage;
      $('coverPreview').hidden = false;
      $('coverPlaceholder').hidden = true;
    }
    $('ingredientsEditor').innerHTML = '';
    $('stepsEditor').innerHTML = '';
    (recipe.ingredients.length ? recipe.ingredients : ['']).forEach(value => addRepeatRow('ingredientsEditor', value, 'ingredient'));
    (recipe.steps.length ? recipe.steps : ['']).forEach(value => addRepeatRow('stepsEditor', value, 'step'));
    renderGalleryEditor();
    $('deleteRecipeBtn').hidden = false;
    $('editorTitle').textContent = 'Edit Recipe';
  }
  showView('editorView');
}

function renderGalleryEditor() {
  $('galleryEditor').innerHTML = state.galleryImages.map((src, index) => `
    <div class="gallery-thumb">
      <img src="${src}" alt="Extra recipe photo ${index + 1}">
      <button type="button" data-remove-photo="${index}" aria-label="Remove photo">×</button>
    </div>
  `).join('');
}

function valuesFromRows(containerId) {
  return [...$(containerId).querySelectorAll('textarea')].map(textarea => textarea.value);
}

async function resizeImageFile(file, maxSize = 1600, quality = 0.82) {
  if (!file || !file.type.startsWith('image/')) throw new Error('Please choose an image file.');
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
  const width = Math.max(1, Math.round(bitmap.width * scale));
  const height = Math.max(1, Math.round(bitmap.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, width, height);
  bitmap.close?.();
  return canvas.toDataURL('image/jpeg', quality);
}

function showToast(message) {
  let toast = document.querySelector('.toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  requestAnimationFrame(() => toast.classList.add('show'));
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
}

async function saveCurrentRecipe() {
  if (!$('titleInput').reportValidity()) return;
  const existing = state.currentRecipeId ? await getRecipe(state.currentRecipeId) : null;
  const recipe = createRecipeRecord({
    ...existing,
    title: $('titleInput').value,
    category: $('categoryInput').value,
    cookTime: $('cookTimeInput').value,
    servings: $('servingsInput').value,
    ingredients: valuesFromRows('ingredientsEditor'),
    steps: valuesFromRows('stepsEditor'),
    coverImage: state.coverImage,
    galleryImages: state.galleryImages,
    favorite: existing?.favorite || false,
    createdAt: existing?.createdAt
  }, state.currentRecipeId || crypto.randomUUID());

  await saveRecipe(recipe);
  state.currentRecipeId = recipe.id;
  await refreshRecipes();
  renderDetail(recipe);
  showView('detailView');
  showToast('Recipe saved');
}

async function toggleFavorite(id) {
  const recipe = await getRecipe(id);
  if (!recipe) return;
  recipe.favorite = !recipe.favorite;
  recipe.updatedAt = new Date().toISOString();
  await saveRecipe(recipe);
  await refreshRecipes();
  if (state.currentRecipeId === id && $('detailView').classList.contains('active-view')) renderDetail(recipe);
}

$('categoryStrip').addEventListener('click', event => {
  const chip = event.target.closest('[data-category]');
  if (!chip) return;
  state.category = chip.dataset.category;
  renderLibrary();
});

$('searchInput').addEventListener('input', event => {
  state.search = event.target.value;
  renderLibrary();
});

$('recipeGrid').addEventListener('click', event => {
  const favorite = event.target.closest('[data-favorite]');
  if (favorite) {
    event.stopPropagation();
    toggleFavorite(favorite.dataset.favorite).catch(console.error);
    return;
  }
  const card = event.target.closest('[data-open-recipe]');
  if (card) openRecipe(card.dataset.openRecipe).catch(console.error);
});

$('galleryEditor').addEventListener('click', event => {
  const button = event.target.closest('[data-remove-photo]');
  if (!button) return;
  state.galleryImages.splice(Number(button.dataset.removePhoto), 1);
  renderGalleryEditor();
});

$('coverInput').addEventListener('change', async event => {
  const file = event.target.files?.[0];
  if (!file) return;
  try {
    state.coverImage = await resizeImageFile(file);
    $('coverPreview').src = state.coverImage;
    $('coverPreview').hidden = false;
    $('coverPlaceholder').hidden = true;
  } catch (error) { showToast(error.message); }
});

$('galleryInput').addEventListener('change', async event => {
  const files = [...(event.target.files || [])].slice(0, Math.max(0, 12 - state.galleryImages.length));
  for (const file of files) {
    try { state.galleryImages.push(await resizeImageFile(file, 1400, 0.78)); }
    catch (error) { showToast(error.message); }
  }
  renderGalleryEditor();
  event.target.value = '';
});

$('addRecipeBtn').addEventListener('click', () => openEditor());
$('emptyAddBtn').addEventListener('click', () => openEditor());
$('backBtn').addEventListener('click', () => { showView('libraryView'); state.currentRecipeId = null; });
$('editRecipeBtn').addEventListener('click', () => openEditor(state.currentRecipeId));
$('cancelEditBtn').addEventListener('click', async () => {
  if (state.currentRecipeId) await openRecipe(state.currentRecipeId);
  else showView('libraryView');
});
$('saveRecipeBtn').addEventListener('click', () => saveCurrentRecipe().catch(error => { console.error(error); showToast('Could not save recipe'); }));
$('addIngredientBtn').addEventListener('click', () => addRepeatRow('ingredientsEditor', '', 'ingredient'));
$('addStepBtn').addEventListener('click', () => addRepeatRow('stepsEditor', '', 'step'));
$('detailFavoriteBtn').addEventListener('click', () => toggleFavorite(state.currentRecipeId).catch(console.error));
$('deleteRecipeBtn').addEventListener('click', async () => {
  if (!state.currentRecipeId) return;
  if (!confirm('Delete this recipe? This cannot be undone.')) return;
  await deleteRecipe(state.currentRecipeId);
  state.currentRecipeId = null;
  await refreshRecipes();
  showView('libraryView');
  showToast('Recipe deleted');
});

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.error));
}

refreshRecipes().catch(error => {
  console.error(error);
  $('emptyState').hidden = false;
  $('emptyState').querySelector('h3').textContent = 'Storage could not open';
  $('emptyState').querySelector('p').textContent = 'Try closing and reopening the app.';
});


</script>
</body>
</html>
